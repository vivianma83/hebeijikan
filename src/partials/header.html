<header class="hdr">
  <div class="wrap hdr__in">
    <a class="brand" href="/">
      <img class="brand__mark" src="/assets/img/logo-mark.png" alt="河北冀勘 Logo" width="160" height="110">
      <span class="brand__txt">
        <span class="brand__cn">{{company.name}}</span>
        <span class="brand__en">Hebei Jikan</span>
      </span>
    </a>

    <button class="navtoggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="展开导航">

    <nav class="nav" id="nav">
      <a href="/"{{nav_index}}>首页</a>

      <a href="/municipal.html"{{nav_municipal}}>市政与城市安全</a>
