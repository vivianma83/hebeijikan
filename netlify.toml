# Netlify 构建与缓存配置
# 推送到 master 后，Netlify 会在自己的服务器上执行下面的命令，本地无需操作。

[build]
  command = "python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

# HTML 不缓存，改了立刻生效
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 机器可读文件同样不缓存，方便爬虫拿到最新版
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/plain; charset=utf-8"

# 图片与样式可以长缓存
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 无后缀路径统一 301 到带 .html 的规范地址。
# 两个作用：
#   1. 关闭 Netlify 的 Pretty URLs 后，之前分发出去的 /about 这类链接照样能打开
#   2. 全站只有一个规范地址，与 canonical 和 sitemap 保持一致
# /tech 是改版前老站的路径，一并保留。

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/municipal"
  to = "/municipal.html"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 301

[[redirects]]
  from = "/equipment"
  to = "/equipment.html"
  status = 301

[[redirects]]
  from = "/credentials"
  to = "/credentials.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 301

[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 301

[[redirects]]
  from = "/tech"
  to = "/services.html"
  status = 301
